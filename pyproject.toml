[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musique-itercomp"
version = "0.1.0"
description = "Research reproduction of IterCOMP with resumable cloud GPU stages"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6.0.2,<7", "spacy>=3.8.7,<3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itercomp = ["prompts/*.txt"]
